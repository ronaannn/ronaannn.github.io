<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Direção & Cinematografia</title>
    <style>
        /* Estilos Base e Tipografia */
        :root {
            --bg-color: #f8f8f5; 
            --text-color: #1a1a1a;
            --hover-color: #555;
            --divider-color: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* Menu Lateral (Desktop) */
        aside {
            width: 260px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--divider-color);
            background-color: var(--bg-color);
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 3rem;
            line-height: 1;
        }

        nav {
            flex-grow: 1;
        }

        nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
            transition: color 0.3s ease, padding-left 0.3s ease;
        }

        nav a:hover {
            color: var(--hover-color);
            padding-left: 5px;
        }

        .contact-info {
            font-size: 0.85rem;
            border-top: 1px solid var(--divider-color);
            padding-top: 1.5rem;
        }

        .contact-info a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: bold;
        }

        /* Conteúdo Principal */
        main {
            margin-left: 260px;
            padding: 3rem 4rem;
            width: calc(100% - 260px);
        }

        section {
            margin-bottom: 6rem;
            padding-top: 2rem; 
        }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #777;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title::after {
            content: "";
            height: 1px;
            background-color: var(--divider-color);
            flex-grow: 1;
        }

        /* Grid de Projetos 16:9 */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 3rem;
        }

        .project-item {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            cursor: pointer;
        }

        .project-thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #ddd;
            position: relative;
            overflow: hidden;
        }

        /* Iframe do Vimeo */
        .project-thumb iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none; /* Impede clique acidental no vídeo enquanto rola a página */
            transition: transform 0.4s ease;
        }

        /* Imagens para Slideshow/Únicas */
        .project-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.6s ease, transform 0.4s ease;
        }

        .project-thumb img.active {
            opacity: 1;
        }

        /* Efeito de zoom suave no hover */
        .project-item:hover .project-thumb iframe,
        .project-item:hover .project-thumb img.active {
            transform: scale(1.03);
        }

        /* Placeholder para projetos sem mídia ainda */
        .empty-thumb::before {
            content: "Em Breve";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #999;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .project-title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* Responsividade */
        @media (max-width: 992px) {
            body { flex-direction: column; }
            aside {
                width: 100%;
                height: auto;
                position: relative;
                padding: 1.5rem;
                border-bottom: 1px solid var(--divider-color);
            }
            .logo { margin-bottom: 1.5rem; text-align: center; }
            nav ul { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 1rem 1.5rem; }
            .contact-info { text-align: center; margin-top: 1.5rem; border-top: none; padding-top: 0; }
            main { margin-left: 0; width: 100%; padding: 2rem 1.5rem; }
            .project-grid { grid-template-columns: 1fr; gap: 2rem; }
        }
    </style>
</head>

    <!-- Script para ativar o slideshow nas galerias de múltiplas imagens -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const slideshows = document.querySelectorAll('.slideshow');
            
            slideshows.forEach(slideContainer => {
                const images = slideContainer.querySelectorAll('img');
                if (images.length > 0) {
                    let currentIndex = 0;
                    images[currentIndex].classList.add('active'); // Garante que a 1ª foto apareça
                    
                    if (images.length > 1) {
                        setInterval(() => {
                            images[currentIndex].classList.remove('active');
                            currentIndex = (currentIndex + 1) % images.length;
                            images[currentIndex].classList.add('active');
                        }, 2000); // Troca a imagem a cada 2 segundos
                    }
                }
            });
        });
    </script>
