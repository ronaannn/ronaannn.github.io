        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
            touch-action: none; 
        }

        .font-elegant { font-family: 'Cinzel', serif; }

        .roulette-item {
            transition: opacity 0.8s ease, transform 1s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0.15;
            padding-top: 1rem;
            padding-bottom: 1rem;
            transform-origin: left center;
            will-change: transform, opacity; 
        }
        .roulette-item.active { opacity: 1; }
        .roulette-item:hover:not(.active) { opacity: 0.5; cursor: pointer; }

        .sub-projects {
            max-height: 0;
            overflow: hidden;
            transition: max-height 1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease;
            opacity: 0;
            margin-top: 0;
            will-change: max-height, opacity;
        }
        .roulette-item.active .sub-projects {
            max-height: 500px; 
            opacity: 1;
            margin-top: 0.5rem;
        }
        
        .sub-project-item {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 300;
            text-transform: lowercase;
            letter-spacing: 0.1em;
            padding: 0.3rem 0;
            color: #888;
            transition: color 0.3s ease, padding-left 0.3s ease;
            cursor: pointer;
        }
        .sub-project-item.active-sub { color: #fff; padding-left: 1rem; }
        .sub-project-item:hover:not(.active-sub) { color: #ccc; }

        @keyframes tremble {
            0%, 100% { transform: translateX(0) rotate(0); }
            2% { transform: translateX(-3px) rotate(-1deg); }
            4% { transform: translateX(3px) rotate(1deg); }
            6% { transform: translateX(-3px) rotate(-1deg); }
            8% { transform: translateX(3px) rotate(1deg); }
            10% { transform: translateX(0) rotate(0); }
        }

        .sub-project-item.contact-item {
            font-size: 1.5rem; 
            text-transform: none; 
            letter-spacing: 0.05em;
            font-weight: 400;
            padding: 0.6rem 0; 
            color: #aaa;
            display: block;
            width: fit-content;
            transform-origin: left center;
            animation: tremble 6s infinite; 
        }
        .sub-project-item.contact-item.active-sub { color: #fff; padding-left: 1.2rem; font-weight: 500; }
        .sub-project-item.contact-item:hover:not(.active-sub) { color: #eee; }

        #roulette-list {
            transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            list-style: none;
            padding: 0;
            margin: 0;
            will-change: transform; 
        }

        .bg-layer {
            transition: opacity 1.5s ease-in-out;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            will-change: opacity;
        }
        
        .iframe-cover {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 40%, rgba(0,0,0,0.1) 100%);
            z-index: 10;
            transition: opacity 0.8s ease-in-out;
        }

        .mask-vertical {
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,1) 30%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 85%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,1) 30%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 85%, rgba(0,0,0,0) 100%);
        }

        /* Classes para a transição de Tela Cheia */
        #menu-main {
            transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.8s ease;
        }
        .menu-hidden {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }
        .overlay-hidden {
            opacity: 0 !important;
        }
        
        /* Botão de Voltar */
        #btn-back {
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            transform: translateX(20px);
        }
        #btn-back.visible {
            opacity: 1 !important;
            pointer-events: auto !important;
            transform: translateX(0);
            cursor: pointer;
        }
        
        /* Controles de Navegação (Setas) */
        .nav-arrow {
            transition: all 0.3s ease;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            -webkit-tap-highlight-color: transparent;
        }
        .nav-arrow:hover {
            transform: scale(1.1);
        }
        .nav-arrow:active {
            transform: scale(0.9);

        function updateRoulettePosition() {
            const items = listEl.children;
            if (!items.length) return;

            const viewportCenter = window.innerHeight / 2;
            let activeItemOffset = 0;

            Array.from(items).forEach((item, idx) => {
                const subItems = item.querySelectorAll('.sub-project-item');
                const titleElement = item.querySelector('.cat-title-text');

                if (idx === currentCatIndex) {
                    item.classList.add('active');
                    activeItemOffset = item.offsetTop + (item.offsetHeight / 2);
                    
                    if (portfolioData[idx].categoryTitle === "CONTATO") {
                        titleElement.className = 'cat-title-text font-elegant text-[11vw] md:text-7xl lg:text-8xl tracking-[0.15em] uppercase whitespace-nowrap font-bold transition-all duration-700 ease-in-out';
                    } else {
                        titleElement.className = 'cat-title-text font-elegant text-[7.5vw] md:text-5xl lg:text-6xl tracking-widest uppercase whitespace-nowrap transition-all duration-700 ease-in-out font-normal';
                    }

                    subItems.forEach((sub, sIdx) => {
                        if (sIdx === currentProjIndex) sub.classList.add('active-sub');
                        else sub.classList.remove('active-sub');
                    });
                } else {
                    item.classList.remove('active');
                    titleElement.className = 'cat-title-text font-elegant text-[7.5vw] md:text-5xl lg:text-6xl tracking-widest uppercase whitespace-nowrap transition-all duration-700 ease-in-out font-normal';
                    subItems.forEach(sub => sub.classList.remove('active-sub'));
                }
            });

            const translateY = viewportCenter - activeItemOffset;

            Array.from(items).forEach((item, idx) => {
                const scale = idx === currentCatIndex ? 1 : 0.85;
                item.style.transform = `scale(${scale})`;
            });

            listEl.style.transform = `translate3d(0, ${translateY}px, 0)`;

            const currentCat = portfolioData[currentCatIndex];

                nameDisplayEl.textContent = currentProj ? currentProj.name : "";
            }

        function applyMobileAutoplay(url) {
            if (!url) return "";
            try {
                let urlObj = new URL(url);
                urlObj.searchParams.set("background", "1");
                urlObj.searchParams.set("muted", "1");
                urlObj.searchParams.set("playsinline", "1");
                urlObj.searchParams.set("autopause", "0");
                return urlObj.toString();
            } catch (e) {
                if (!url.includes("playsinline=1")) {
                    return url + (url.includes("?") ? "&playsinline=1&muted=1&autopause=0&background=1" : "?playsinline=1&muted=1&autopause=0&background=1");
                }
                return url;
            }
        }

            if (proj.mediaList && proj.mediaList.length > 1) return proj.mediaList;
            if (proj.iframeUrls && proj.iframeUrls.length > 1) return proj.iframeUrls;
            if (proj.images && proj.images.length > 1) return proj.images;
            return [];
        }

        function playMedia() {
            slideStateId++; 
            currentImageRequest++; 
            clearTimeout(slideTimeout);

            const pIndex = currentProjIndex >= 0 ? currentProjIndex : 0;
            const proj = portfolioData[currentCatIndex].projects[pIndex];

            bgVideo.classList.remove('opacity-100'); bgVideo.classList.add('opacity-0');
            setTimeout(() => { if (bgVideo.classList.contains('opacity-0')) bgVideo.pause(); }, 1000);

            if (proj.mediaList && proj.mediaList.length > 0) {
                renderMediaItem(proj.mediaList[0]);
                startSlideshow();
                return;
            }

            const isIframe = (proj.iframeUrls && proj.iframeUrls.length > 0) || proj.iframeUrl;
            const isVideo = !!proj.videoLocal;
            const isImage = proj.images && proj.images.length > 0;

            if (!isIframe) {
                bgIframe1.classList.remove('opacity-100'); bgIframe1.classList.add('opacity-0');
                bgIframe2.classList.remove('opacity-100'); bgIframe2.classList.add('opacity-0');
                setTimeout(() => { 
                    if (bgIframe1.classList.contains('opacity-0')) bgIframe1.src = "";
                    if (bgIframe2.classList.contains('opacity-0')) bgIframe2.src = "";
                }, 1000);
            }
            if (!isImage) {
                bgImg1.classList.remove('opacity-100'); bgImg1.classList.add('opacity-0');
                bgImg2.classList.remove('opacity-100'); bgImg2.classList.add('opacity-0');
            }

            if (proj.iframeUrls && proj.iframeUrls.length > 0) {
                const firstData = proj.iframeUrls[0];
                const firstUrl = typeof firstData === 'string' ? firstData : firstData.url;
                changeIframe(firstUrl);
                startSlideshow();
            } 
            else if (proj.iframeUrl) {
                changeIframe(proj.iframeUrl);
            } 
            else if (proj.videoLocal) {
                if (!bgVideo.src.endsWith(proj.videoLocal)) {
                    bgVideo.src = proj.videoLocal;
                }
                bgVideo.play();
                bgVideo.classList.remove('opacity-0');
                bgVideo.classList.add('opacity-100');
            } 
            else if (proj.images && proj.images.length > 0) {
                const firstImg = proj.images[0];
                const firstUrl = typeof firstImg === 'string' ? firstImg : firstImg.url;
                const firstPos = typeof firstImg === 'object' && firstImg.position ? firstImg.position : 'center';
                changeImage(firstUrl, firstPos);
                startSlideshow();
            }
        }

        function renderMediaItem(media) {
            if (media.type === "iframe") {
                changeIframe(media.url);
                bgImg1.classList.remove('opacity-100'); bgImg1.classList.add('opacity-0');
                bgImg2.classList.remove('opacity-100'); bgImg2.classList.add('opacity-0');
            } else if (media.type === "image") {
                changeImage(media.url, media.position);
                bgIframe1.classList.remove('opacity-100'); bgIframe1.classList.add('opacity-0');
                bgIframe2.classList.remove('opacity-100'); bgIframe2.classList.add('opacity-0');
                setTimeout(() => {
                    if (bgIframe1.classList.contains('opacity-0')) bgIframe1.src = "";
                    if (bgIframe2.classList.contains('opacity-0')) bgIframe2.src = "";
                }, 1000);
            }
        }

        function changeIframe(url) {
            currentImageRequest++;
            const requestId = currentImageRequest;
            const safeUrl = applyMobileAutoplay(url);

            const handleLoad = (iframeIn, iframeOut, layerIn, layerOut) => {
                if (requestId !== currentImageRequest) return;
                iframeIn.classList.remove('opacity-0');
                iframeIn.classList.add('opacity-100');
                iframeOut.classList.remove('opacity-100');
                iframeOut.classList.add('opacity-0');
                
                if (safeUrl.includes('vimeo')) {
                    try {
                        const player = new Vimeo.Player(iframeIn);
                        player.play().catch(()=>{});
                    } catch(e) {}
                }

                setTimeout(() => { if(activeIframeLayer === layerIn) iframeOut.src = ""; }, 1500);
            };

            if (activeIframeLayer === 1) {
                bgIframe2.onload = () => handleLoad(bgIframe2, bgIframe1, 2, 1);
                bgIframe2.src = safeUrl;
                activeIframeLayer = 2;
            } else {
                bgIframe1.onload = () => handleLoad(bgIframe1, bgIframe2, 1, 2);
                bgIframe1.src = safeUrl;
                activeIframeLayer = 1;
            }
        }

        function changeImage(url, position = 'center') {
            currentImageRequest++;
            const requestId = currentImageRequest;

            const img = new Image();
            img.onload = () => {
                if (requestId !== currentImageRequest) return;

                const pos = position || 'center';

                if (activeBgLayer === 1) {
                    bgImg2.style.objectPosition = pos;
                    bgImg2.src = url;
                    bgImg2.classList.remove('opacity-0');
                    bgImg2.classList.add('opacity-100');
                    bgImg1.classList.remove('opacity-100');
                    bgImg1.classList.add('opacity-0');
                    activeBgLayer = 2;
                } else {
                    bgImg1.style.objectPosition = pos;
                    bgImg1.src = url;
                    bgImg1.classList.remove('opacity-0');
                    bgImg1.classList.add('opacity-100');
                    bgImg2.classList.remove('opacity-100');
                    bgImg2.classList.add('opacity-0');
                    activeBgLayer = 1;
                }
            };
            img.src = url;
        }

        function startSlideshow() {
            const pIndex = currentProjIndex >= 0 ? currentProjIndex : 0;
            const proj = portfolioData[currentCatIndex].projects[pIndex];
            
            const hasMultiple = getMediaListForProj(proj).length > 1;

            if (hasMultiple) {
                scheduleNextImage(slideStateId);
            }
        }

        function scheduleNextImage(stateId) {
            const pIndex = currentProjIndex >= 0 ? currentProjIndex : 0;
            const proj = portfolioData[currentCatIndex].projects[pIndex];
            
            const mediaList = getMediaListForProj(proj);
            if (!mediaList || mediaList.length <= 1) return;

            const currentMediaData = mediaList[currentImageIndex];
            const duration = currentMediaData.time || 4000;

            slideTimeout = setTimeout(() => {
                if (stateId !== slideStateId) return;

                changeMediaManually(1, false); // Avança automático
                
            }, duration);
        }

        // Função mestre de Navegação de Mídia
        function changeMediaManually(direction, isManual = true) {
            const pIndex = currentProjIndex >= 0 ? currentProjIndex : 0;
            const proj = portfolioData[currentCatIndex].projects[pIndex];
            
            const mediaList = getMediaListForProj(proj);
            if (!mediaList || mediaList.length <= 1) return;

            if (isManual) {
                clearTimeout(slideTimeout);
                slideStateId++; // Invalida cronogramas antigos
            }

            // Atualiza o índice com suporte a loop reverso (esquerda)
            currentImageIndex = (currentImageIndex + direction + mediaList.length) % mediaList.length;
            const nextMediaData = mediaList[currentImageIndex];

            // Renderiza conforme o tipo
            if (proj.mediaList && proj.mediaList.length > 1) {
                renderMediaItem(nextMediaData);
            } else if (proj.iframeUrls && proj.iframeUrls.length > 1) {
                const nextUrl = typeof nextMediaData === 'string' ? nextMediaData : nextMediaData.url;
                changeIframe(nextUrl);
            } else {
                const nextUrl = typeof nextMediaData === 'string' ? nextMediaData : nextMediaData.url;
                const nextPos = typeof nextMediaData === 'object' && nextMediaData.position ? nextMediaData.position : 'center';
                changeImage(nextUrl, nextPos);
            }
            
            // Se foi um clique manual, reinicia a contagem automática a partir de agora
            if (isManual) {
                scheduleNextImage(slideStateId);
            } else {
                // Se foi o sistema que chamou, apenas repete o ciclo normal
                scheduleNextImage(slideStateId);
            }
        }

        function prevMedia() { changeMediaManually(-1); }
        function nextMedia() { changeMediaManually(1); }

        /* FUNÇÕES DE TELA CHEIA */
        function enterFullscreen() {
            isFullscreen = true;
            menuMain.classList.add('menu-hidden');
            bgOverlay.classList.add('overlay-hidden');
            portfolioText.style.opacity = '0';
            btnBack.classList.add('visible');
            
            // Verifica se o projeto tem múltiplas mídias para mostrar as setas
            const pIndex = currentProjIndex >= 0 ? currentProjIndex : 0;
            const proj = portfolioData[currentCatIndex].projects[pIndex];
            if (getMediaListForProj(proj).length > 1) {
                mediaNav.classList.remove('opacity-0');
            }
        }

        function exitFullscreen() {
            isFullscreen = false;
            menuMain.classList.remove('menu-hidden');
            bgOverlay.classList.remove('overlay-hidden');
            portfolioText.style.opacity = '1';
            btnBack.classList.remove('visible');
            mediaNav.classList.add('opacity-0');
        }

        function selectCategory(cIndex) {
            if (isFullscreen) return; 
            if (cIndex === currentCatIndex) return; 
            currentCatIndex = cIndex;
            
            if (portfolioData[cIndex].categoryTitle === "CONTATO") {
                currentProjIndex = -1;
            } else {
                currentProjIndex = 0; 
            }
            
            if (navigator.vibrate) navigator.vibrate(30);
            
            setTimeout(() => {
                updateRoulettePosition();
                playMedia();
            }, 50);
        }

        function selectProject(cIndex, pIndex) {
            if (cIndex === currentCatIndex && pIndex === currentProjIndex) {
                enterFullscreen();
                return;
            }
            
            currentCatIndex = cIndex;
            currentProjIndex = pIndex;
            
            if (navigator.vibrate) navigator.vibrate(30);

            updateRoulettePosition();
            playMedia();
            enterFullscreen(); 
        }

        function handleNavigation(direction) {
            if (isAnimatingScroll || isFullscreen) return; 
            if (direction === 'down' && currentCatIndex < portfolioData.length - 1) {
                isAnimatingScroll = true;
                selectCategory(currentCatIndex + 1);
            } else if (direction === 'up' && currentCatIndex > 0) {
                isAnimatingScroll = true;
                selectCategory(currentCatIndex - 1);
            }
            setTimeout(() => { isAnimatingScroll = false; }, 0); 
        }

        window.addEventListener('wheel', (e) => {
            if (Math.abs(e.deltaY) < 30) return; 
            handleNavigation(e.deltaY > 0 ? 'down' : 'up');
        });

        window.addEventListener('keydown', (e) => {
            if (isFullscreen) {
                if (e.key === 'Escape') exitFullscreen(); 
                if (e.key === 'ArrowLeft') prevMedia();
                if (e.key === 'ArrowRight') nextMedia();
            } else {
                if (e.key === 'ArrowDown') handleNavigation('down');
                if (e.key === 'ArrowUp') handleNavigation('up');
            }
        });

        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        window.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].clientX;
            touchStartY = e.changedTouches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].clientX;
            touchEndY = e.changedTouches[0].clientY;
            handleGesture();
        }, { passive: true });

        function handleGesture() {
            const swipeThreshold = 40; 
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (isFullscreen) {
                // Swipe horizontal para navegar entre mídias (se aplicável)
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > swipeThreshold) {
                    const proj = portfolioData[currentCatIndex].projects[currentProjIndex >= 0 ? currentProjIndex : 0];
                    if (getMediaListForProj(proj).length > 1) {
                        if (diffX > 0) prevMedia(); // Deslizou pra direita = Volta imagem
                        else nextMedia(); // Deslizou pra esquerda = Passa imagem
                    }
                }
            } else {
                // Swipe vertical para navegar no menu principal
                if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > swipeThreshold) {
                    if (diffY < 0) handleNavigation('down'); 
                    else handleNavigation('up'); 
                }
            }
        }

        document.body.addEventListener('touchstart', () => {
            if (bgVideo && bgVideo.paused && bgVideo.classList.contains('opacity-100')) {
                bgVideo.play().catch(()=>{});
            }
            try {
                if (bgIframe1.classList.contains('opacity-100') && bgIframe1.src.includes('vimeo')) {
                    new Vimeo.Player(bgIframe1).play().catch(()=>{});
                }
                if (bgIframe2.classList.contains('opacity-100') && bgIframe2.src.includes('vimeo')) {
                    new Vimeo.Player(bgIframe2).play().catch(()=>{});
                }
            } catch(e) {}
        }, { passive: true });

        document.addEventListener('DOMContentLoaded', () => {
            initList();
            updateRoulettePosition();
            playMedia();
        });

        window.addEventListener('resize', updateRoulettePosition);
    </script>
</body>
</html>
