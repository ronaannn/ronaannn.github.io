    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
            touch-action: none; 
        }

        .font-elegant { font-family: 'Cinzel', serif; }

        .roulette-item {
            transition: opacity 0.8s ease, transform 1s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0.15;
            padding-top: 1rem;
            padding-bottom: 1rem;
            transform-origin: left center;
            will-change: transform, opacity; 
        }
        .roulette-item.active {
            opacity: 1;
        }
        .roulette-item:hover:not(.active) {
            opacity: 0.5;
            cursor: pointer;
        }

        .sub-projects {
            max-height: 0;
            overflow: hidden;
            transition: max-height 1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease;
            opacity: 0;
            margin-top: 0;
            will-change: max-height, opacity;
        }
        .roulette-item.active .sub-projects {
            max-height: 500px; 
            opacity: 1;
            margin-top: 0.5rem;
        }
        
        .sub-project-item {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 300;
            text-transform: lowercase;
            letter-spacing: 0.1em;
            padding: 0.3rem 0;
            color: #888;
            transition: color 0.3s ease, padding-left 0.3s ease;
            cursor: pointer;
        }
        .sub-project-item.active-sub {
            color: #fff;
            padding-left: 1rem; 
        }
        .sub-project-item:hover:not(.active-sub) {
            color: #ccc;
        }

        @keyframes tremble {
            0%, 100% { transform: translateX(0) rotate(0); }
            2% { transform: translateX(-3px) rotate(-1deg); }
            4% { transform: translateX(3px) rotate(1deg); }
            6% { transform: translateX(-3px) rotate(-1deg); }
            8% { transform: translateX(3px) rotate(1deg); }
            10% { transform: translateX(0) rotate(0); }
        }

        .sub-project-item.contact-item {
            font-size: 1.5rem; 
            text-transform: none; 
            letter-spacing: 0.05em;
            font-weight: 400;
            padding: 0.6rem 0; 
            color: #aaa;
            display: block;
            width: fit-content;
            transform-origin: left center;
            animation: tremble 6s infinite; 
        }
        .sub-project-item.contact-item.active-sub {
            color: #fff;
            padding-left: 1.2rem;
            font-weight: 500; 
        }
        .sub-project-item.contact-item:hover:not(.active-sub) {
            color: #eee;
        }

        #roulette-list {
            transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            list-style: none;
            padding: 0;
            margin: 0;
            will-change: transform; 
        }

        .bg-layer {
            transition: opacity 1.5s ease-in-out;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            will-change: opacity;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 40%, rgba(0,0,0,0.1) 100%);
            z-index: 10;
        }

        .mask-vertical {
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,1) 30%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 85%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,1) 30%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 85%, rgba(0,0,0,0) 100%);
        }
    </style>
</head>
<body class="relative antialiased selection:bg-white selection:text-black">

    <div id="bg-container" class="absolute inset-0 z-0">
        <img id="bg-img-1" class="bg-layer opacity-100" src="" alt="" decoding="async">
        <img id="bg-img-2" class="bg-layer opacity-0" src="" alt="" decoding="async">
        <video id="bg-video" class="bg-layer opacity-0 object-cover w-full h-full absolute inset-0 z-0 transition-opacity duration-1000" autoplay loop muted playsinline></video>
        <div class="overlay"></div>
    </div>

    <div class="relative z-20 w-full h-full flex flex-col pointer-events-none">
        
        <header class="p-8 md:p-12 absolute top-0 left-0 w-full flex justify-between items-center z-30 pointer-events-auto">
            <div class="text-xs tracking-[0.3em] uppercase font-light">Ronã <br> <span class="font-bold">Grangeiro</span></div>
            <div class="text-xs tracking-widest uppercase font-light">Portifólio</div>
        </header>

        <main class="flex-1 relative w-full md:w-2/3 h-full mask-vertical z-20">
            <ul id="roulette-list" class="pointer-events-auto">
                <!-- Injetado via JS -->
            </ul>
        </main>

        <div class="absolute bottom-8 right-8 md:right-12 z-30 pointer-events-auto text-right">
            <div id="project-counter" class="text-sm font-light tracking-widest mb-1"></div>
            <div id="project-name-display" class="text-xs text-gray-400 tracking-[0.2em] uppercase"></div>
        </div>
    </div>

    <script>
        const portfolioData = [
            {
                categoryTitle: "FASHION FILM",
                projects: [
                    {

                        images: [
                            "https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=2070&auto=format&fit=crop",
                            "https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1976&auto=format&fit=crop"
                        ]

                            "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop"
                        ]

                ]
            },
            {

                            "https://i.pinimg.com/originals/ed/36/d0/ed36d0b629f4f85f9154325992f6a736.gif"

                    }
                ]
            },
            {

                projects: [
                    { 
                        name: "sonhos", 
                        images: [
			   "https://mir-s3-cdn-cf.behance.net/project_modules/1400_opt_1/e6587e255939661.6aae2f9dae7a4.jpg"
                        ] 
                    }
                ]
            },
            {
                categoryTitle: "SHOW",
                projects: [
                    { 
                        name: "kyan", 
                        images: [
			    "https://mir-s3-cdn-cf.behance.net/project_modules/1400_opt_1/d04585214797941.675ee8bae7825.jpg",
			    "https://mir-s3-cdn-cf.behance.net/project_modules/1400_opt_1/d9e3a7214797941.675ee8bae7da0.jpg",
			    "https://mir-s3-cdn-cf.behance.net/project_modules/1400_opt_1/083b49214797941.675ee8baea749.jpg",
			    "https://mir-s3-cdn-cf.behance.net/project_modules/1400_opt_1/4886bc214797941.675ee8baea0ee.jpg",
			    "https://mir-s3-cdn-cf.behance.net/project_modules/1400_opt_1/e46f92214797941.675ee8bae82f7.jpg"
                        ] 
                    },
                    { 
		      	name: "matuê",
		        images: [
			    "https://mir-s3-cdn-cf.behance.net/project_modules/1400_opt_1/b3c8da228875229.685ac730a501c.jpeg",
				"https://mir-s3-cdn-cf.behance.net/project_modules/1400_opt_1/0b246a228875229.685ac730a5e63.jpg"
			] 
		    },
                    { 
                        name: "sá e guarabyra", 
                        images: [
			    "https://mir-s3-cdn-cf.behance.net/project_modules/1400_opt_1/a268db228219853.684f7786821cd.jpg",
			    "https://mir-s3-cdn-cf.behance.net/project_modules/1400_opt_1/05f3e0228219853.684f778680c1e.jpg",
			    "https://mir-s3-cdn-cf.behance.net/project_modules/1400_opt_1/7097de228219853.684f7786845cf.jpg",
			    "https://mir-s3-cdn-cf.behance.net/project_modules/1400_opt_1/cd2a65228219853.684f778684d70.jpg",
			    "https://mir-s3-cdn-cf.behance.net/project_modules/1400_opt_1/18a07f228219853.684f778681293.jpg"
                        ]
                    },
                    { 
                        name: "yunk vino", 
                        images: [
                            { url: "VINO.gif", time: 3000 },
                            { url: "VINO_1.jpg", time: 3000 },
                            { url: "VINO_2.jpg", time: 3000 }
                            ]
                    },
                    { 
                        name: "danzo", 
                        images: [
                            { url: "DANZO_1.jpg", time: 3000 },
                            { url: "DANZO_2.jpg", time: 3000 }
                        ]
                    }
                ] // <-- ESTE COLCHETE ESTAVA FALTANDO PARA FECHAR OS "projects"
            }, // <-- ESTA CHAVE ESTAVA FALTANDO PARA FECHAR A CATEGORIA "SHOW"
            {
                categoryTitle: "DOCUMENTÁRIO",
                projects: [
                    { 
                        name: "pertencer", 
                        images: [
                            "https://images.unsplash.com/photo-1552820728-8b83bb6b773f?q=80&w=2070&auto=format&fit=crop",
                            "https://images.unsplash.com/photo-1604085572504-a392ddf0d86a?q=80&w=2070&auto=format&fit=crop"
                        ] 
                    }
                ]
            },
            {
                categoryTitle: "CONTATO",
                projects: [
                    { 
                        name: "whatsapp (11) 97508-5574", 
                        link: "https://wa.me/5511975085574", 
                        images: ["https://images.unsplash.com/photo-1596726229983-6f4a869801be?q=80&w=2070&auto=format&fit=crop"] 
                    },
                    { 
                        name: "e-mail: ronan15pc@hotmail.com", 
                        link: "mailto:ronan15pc@hotmail.com", 
                        images: ["https://images.unsplash.com/photo-1596726229983-6f4a869801be?q=80&w=2070&auto=format&fit=crop"] 
                    },
                    { 
                        name: "@ronannronan", 
                        link: "https://instagram.com/ronannronan", 
                        images: ["https://images.unsplash.com/photo-1596726229983-6f4a869801be?q=80&w=2070&auto=format&fit=crop"] 
                    }
                ]
            }
        ];

        let currentCatIndex = 0;
        let currentProjIndex = 0;
        let currentImageIndex = 0;
        let activeBgLayer = 1;
        let slideTimeout; 
        let isAnimatingScroll = false;

        // IDs para gerir downloads e temporizadores sem causar misturas
        let currentImageRequest = 0;
        let slideStateId = 0;

        const listEl = document.getElementById('roulette-list');
        const bgImg1 = document.getElementById('bg-img-1');
        const bgImg2 = document.getElementById('bg-img-2');
        const bgVideo = document.getElementById('bg-video');
        const counterEl = document.getElementById('project-counter');
        const nameDisplayEl = document.getElementById('project-name-display');

        function initList() {
            portfolioData.forEach((cat, cIndex) => {
                const liCat = document.createElement('li');
                liCat.className = 'roulette-item pl-6 md:pl-16';
                
                const isContact = cat.categoryTitle === "CONTATO";
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'cat-title-text font-elegant text-[7.5vw] md:text-5xl lg:text-6xl tracking-widest uppercase whitespace-nowrap transition-all duration-700 ease-in-out font-normal';
                titleDiv.textContent = cat.categoryTitle;
                titleDiv.onclick = () => selectCategory(cIndex);
                
                const ulSub = document.createElement('ul');
                ulSub.className = 'sub-projects list-none pl-4';
                
                cat.projects.forEach((proj, pIndex) => {
                    const liSub = document.createElement('li');
                    liSub.className = 'sub-project-item';
                    
                    if (isContact) {
                        liSub.classList.add('contact-item');
                        liSub.style.animationDelay = `${pIndex * 2}s`;
                    }
                    
                    liSub.textContent = proj.name;
                    liSub.onclick = (e) => {
                        e.stopPropagation(); 
                        
                        if (proj.link) {
                            if (proj.link.startsWith('mailto:')) {
                                window.location.href = proj.link;
                            } else {
                                window.open(proj.link, '_blank');
                            }
                        }
                        
                        selectProject(cIndex, pIndex);
                    };
                    ulSub.appendChild(liSub);
                });

                liCat.appendChild(titleDiv);
                liCat.appendChild(ulSub);
                listEl.appendChild(liCat);
            });
        }

        function updateRoulettePosition() {
            const items = listEl.children;
            if (!items.length) return;

            const viewportCenter = window.innerHeight / 2;
            let activeItemOffset = 0;

            Array.from(items).forEach((item, idx) => {
                const subItems = item.querySelectorAll('.sub-project-item');
                const titleElement = item.querySelector('.cat-title-text');

                if (idx === currentCatIndex) {
                    item.classList.add('active');
                    activeItemOffset = item.offsetTop + (item.offsetHeight / 2);
                    
                    if (portfolioData[idx].categoryTitle === "CONTATO") {
                        titleElement.className = 'cat-title-text font-elegant text-[11vw] md:text-7xl lg:text-8xl tracking-[0.15em] uppercase whitespace-nowrap font-bold transition-all duration-700 ease-in-out';
                    } else {
                        titleElement.className = 'cat-title-text font-elegant text-[7.5vw] md:text-5xl lg:text-6xl tracking-widest uppercase whitespace-nowrap transition-all duration-700 ease-in-out font-normal';
                    }

                    subItems.forEach((sub, sIdx) => {
                        if (sIdx === currentProjIndex) sub.classList.add('active-sub');
                        else sub.classList.remove('active-sub');
                    });
                } else {
                    item.classList.remove('active');
                    titleElement.className = 'cat-title-text font-elegant text-[7.5vw] md:text-5xl lg:text-6xl tracking-widest uppercase whitespace-nowrap transition-all duration-700 ease-in-out font-normal';
                    subItems.forEach(sub => sub.classList.remove('active-sub'));
                }
            });

            const translateY = viewportCenter - activeItemOffset;

            Array.from(items).forEach((item, idx) => {
                const scale = idx === currentCatIndex ? 1 : 0.85;
                item.style.transform = `scale(${scale})`;
            });

            listEl.style.transform = `translate3d(0, ${translateY}px, 0)`;

            const currentCat = portfolioData[currentCatIndex];
            
            if (currentCat.categoryTitle === "CONTATO") {
                counterEl.style.opacity = '0';
                nameDisplayEl.textContent = ""; 
            } else {
                const currentProj = currentCat.projects[currentProjIndex];
                counterEl.style.opacity = '1';
                counterEl.textContent = `0${currentProjIndex + 1} / 0${currentCat.projects.length}`;
                nameDisplayEl.textContent = currentProj ? currentProj.name : "";
            }
        }

        function playMedia() {
            slideStateId++; 
            currentImageRequest++; 
            clearTimeout(slideTimeout);

            const pIndex = currentProjIndex >= 0 ? currentProjIndex : 0;
            const proj = portfolioData[currentCatIndex].projects[pIndex];
            
            currentImageIndex = 0; 
            
            if (proj.videoLocal) {
                if (!bgVideo.src.endsWith(proj.videoLocal)) {
                    bgVideo.src = proj.videoLocal;
                }
                bgVideo.classList.remove('opacity-0');
                bgVideo.classList.add('opacity-100');
            } else {
                bgVideo.classList.remove('opacity-100');
                bgVideo.classList.add('opacity-0');
                setTimeout(() => { 
                    if (bgVideo.classList.contains('opacity-0')) bgVideo.src = ""; 
                }, 1000);
                
                const firstImg = proj.images[0];
                const firstUrl = typeof firstImg === 'string' ? firstImg : firstImg.url;
                
                changeImage(firstUrl);
                startSlideshow();
            }
        }

        function changeImage(url) {
            currentImageRequest++;
            const requestId = currentImageRequest;

            const img = new Image();
            img.onload = () => {
                if (requestId !== currentImageRequest) return;

                if (activeBgLayer === 1) {
                    bgImg2.src = url;
                    bgImg2.classList.remove('opacity-0');
                    bgImg2.classList.add('opacity-100');
                    bgImg1.classList.remove('opacity-100');
                    bgImg1.classList.add('opacity-0');
                    activeBgLayer = 2;
                } else {
                    bgImg1.src = url;
                    bgImg1.classList.remove('opacity-0');
                    bgImg1.classList.add('opacity-100');
                    bgImg2.classList.remove('opacity-100');
                    bgImg2.classList.add('opacity-0');
                    activeBgLayer = 1;
                }
            };
            img.src = url;
        }

        function startSlideshow() {
            const pIndex = currentProjIndex >= 0 ? currentProjIndex : 0;
            const proj = portfolioData[currentCatIndex].projects[pIndex];
            
            if (!proj.videoLocal && proj.images.length > 1) {
                scheduleNextImage(slideStateId);
            }
        }

        function scheduleNextImage(stateId) {
            const pIndex = currentProjIndex >= 0 ? currentProjIndex : 0;
            const proj = portfolioData[currentCatIndex].projects[pIndex];
            const currentImgData = proj.images[currentImageIndex];
            
            const duration = currentImgData.time || 4000;

            slideTimeout = setTimeout(() => {
                if (stateId !== slideStateId) return;

                currentImageIndex = (currentImageIndex + 1) % proj.images.length;
                const nextImgData = proj.images[currentImageIndex];
                
                const nextUrl = typeof nextImgData === 'string' ? nextImgData : nextImgData.url;
                
                changeImage(nextUrl);
                scheduleNextImage(stateId); 
            }, duration);
        }

        function selectCategory(cIndex) {
            if (cIndex === currentCatIndex) return; 
            currentCatIndex = cIndex;
            
            if (portfolioData[cIndex].categoryTitle === "CONTATO") {
                currentProjIndex = -1;
            } else {
                currentProjIndex = 0; 
            }
            
            if (navigator.vibrate) navigator.vibrate(30);
            
            setTimeout(() => {
                updateRoulettePosition();
                playMedia();
            }, 50);
        }

        function selectProject(cIndex, pIndex) {
            if (cIndex === currentCatIndex && pIndex === currentProjIndex) return;
            
            currentCatIndex = cIndex;
            currentProjIndex = pIndex;
            
            if (navigator.vibrate) navigator.vibrate(30);

            updateRoulettePosition();
            playMedia();
        }

        function handleNavigation(direction) {
            if (isAnimatingScroll) return;
            if (direction === 'down' && currentCatIndex < portfolioData.length - 1) {
                isAnimatingScroll = true;
                selectCategory(currentCatIndex + 1);
            } else if (direction === 'up' && currentCatIndex > 0) {
                isAnimatingScroll = true;
                selectCategory(currentCatIndex - 1);
            }
            setTimeout(() => { isAnimatingScroll = false; }, 0); 
        }

        window.addEventListener('wheel', (e) => {
            if (Math.abs(e.deltaY) < 30) return; 
            handleNavigation(e.deltaY > 0 ? 'down' : 'up');
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') handleNavigation('down');
            if (e.key === 'ArrowUp') handleNavigation('up');
        });

        let touchStartY = 0;
        let touchEndY = 0;

        window.addEventListener('touchstart', e => {
            touchStartY = e.changedTouches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', e => {
            touchEndY = e.changedTouches[0].clientY;
            handleGesture();
        }, { passive: true });

        function handleGesture() {
            const swipeThreshold = 40; 
            if (touchEndY < touchStartY - swipeThreshold) {
                handleNavigation('down'); 
            } else if (touchEndY > touchStartY + swipeThreshold) {
                handleNavigation('up'); 
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initList();
            
            const firstProj = portfolioData[0].projects[0];
            const firstImgData = firstProj.images[0];
            const firstUrl = typeof firstImgData === 'string' ? firstImgData : firstImgData.url;
            
            if (!firstProj.videoLocal) {
                changeImage(firstUrl);
            }
            
            setTimeout(() => {
                updateRoulettePosition();
                playMedia();
            }, 100);
        });

        window.addEventListener('resize', updateRoulettePosition);
    </script>
</body>
</html>
